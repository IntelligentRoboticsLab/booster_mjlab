name: Docs

on:
  push:
    branches: [main]
    paths:
      - website/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

# Never run two Pages deployments at once, but let in-flight ones finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The project page is a static site with no build step.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - id: deployment
        uses: actions/deploy-pages@v4
